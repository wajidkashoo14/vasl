<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASL</title>
<meta name="description" content="Stories in motion, crafted through light, emotion, and the moments that matter.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,200..500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#A4855A; --paper:#F5F0E7; --ink:#2A2520;
    --inkmute:#5B5349; --hairline:rgba(42,37,32,.14); --radius:2px;
  }
  *{ box-sizing:border-box; }
  html{ background:#0E0B08; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; scroll-behavior:smooth; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Hanken Grotesk',system-ui,sans-serif; overflow-x:hidden; }
  img{ display:block; }
  a{ color:inherit; }
  ::selection{ background:#3A2C20; color:var(--paper); }
  button{ cursor:pointer; font-family:inherit; background:none; border:none; color:inherit; }

  nav{ position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    height:74px; padding:0 clamp(22px,6vw,110px); background:rgba(245,240,231,.92);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border-bottom:1px solid var(--hairline); }
  .logo{ display:inline-flex; align-items:center; text-decoration:none; height:100%; }
  .logo img{ height:48px; width:auto; filter:brightness(0); }
  .nav-links{ display:flex; align-items:center; gap:clamp(12px,1.8vw,30px); }
  .nav-link{ color:rgba(42,37,32,.6); text-decoration:none; font:500 12px/1 'Hanken Grotesk'; letter-spacing:.13em; text-transform:uppercase; transition:color .4s ease; min-height:44px; display:inline-flex; align-items:center; }
  .nav-link:hover,.nav-link[aria-current="page"]{ color:var(--ink); }
  .menu-btn{ display:inline-flex; align-items:center; min-height:44px; background:none; border:1px solid currentColor; color:var(--ink); padding:10px 16px; font:500 11px/1 'Hanken Grotesk'; letter-spacing:.2em; text-transform:uppercase; }
  @media (max-width:1180px){ .nav-links{ display:none; } }

  /* overflow-y so a short screen can still reach the last links: the panel is
     fixed, so without it anything past the fold is unreachable, not just clipped */
  #mobileMenu{ position:fixed; inset:0; z-index:60; background:#15110D; color:#F4EEE3; display:none; flex-direction:column; padding:26px clamp(22px,6vw,110px) 44px;
    overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #mobileMenu.open{ display:flex; }
  .mm-top{ display:flex; justify-content:space-between; align-items:center; }
  .mm-top .logo img{ filter:brightness(0) invert(1); }
  .mm-close{ background:none; border:1px solid rgba(244,238,227,.5); color:#F4EEE3; padding:10px 16px; font:500 11px/1 'Hanken Grotesk'; letter-spacing:.2em; text-transform:uppercase; }
  .mm-links{ margin:auto 0; display:flex; flex-direction:column; gap:2px; }
  /* the clamp scales on width, but a landscape phone is wide and short — it hit
     the 41px ceiling exactly where there was least room. 6.5vh is the size at
     which all eight links still fit a 390px-tall screen, and never falls below
     the width-driven size, so portrait and desktop are unchanged. */
  .mm-links a{ font-family:'Newsreader',serif; font-weight:300; font-size:min(clamp(21px,5.95vw,41px), 6.5vh); line-height:1.2; color:#F4EEE3; text-decoration:none; }
  .mm-links a:hover{ color:var(--accent); }

  .page-head{ padding:calc(74px + clamp(56px,9vh,110px)) clamp(24px,6vw,110px) clamp(40px,6vh,70px); max-width:1380px; margin:0 auto; }
  .eyebrow{ display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .eyebrow .line{ width:30px; height:1px; background:var(--accent); }
  .eyebrow .label{ font:500 11px/1 'Hanken Grotesk'; letter-spacing:.26em; text-transform:uppercase; color:var(--accent); }
  .page-head h1{ font-family:'Newsreader',serif; font-weight:200; font-size:clamp(34px,6vw,86px); line-height:1.02; letter-spacing:-.03em; margin:0; }
  .page-head h1 em{ font-style:italic; color:var(--accent); }
  .page-head .lead{ font-family:'Newsreader',serif; font-style:italic; font-weight:300;
    font-size:clamp(18px,2vw,28px); line-height:1.5; color:#3A2C20; margin:clamp(24px,3.4vh,38px) 0 0; max-width:34ch; text-wrap:pretty; }

  .btn-ink{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; gap:10px; padding:17px 42px;
    background:transparent; border:1px solid rgba(42,37,32,.38); color:var(--ink); text-decoration:none; border-radius:var(--radius);
    font:500 12px/1 'Hanken Grotesk'; letter-spacing:.18em; text-transform:uppercase;
    transition:background .5s ease, color .5s ease, border-color .5s ease; }
  .btn-ink:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  /* used on both <a> and <button>, so the background must be set explicitly:
     a bare button keeps the UA grey and the cream text vanishes into it */
  .btn-light{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:17px 42px;
    background:transparent; border:1px solid rgba(244,238,227,.55); color:#F4EEE3; text-decoration:none; font:500 12px/1 'Hanken Grotesk';
    letter-spacing:.18em; text-transform:uppercase; border-radius:var(--radius);
    transition:background .5s ease,color .5s ease,border-color .5s ease; }
  .btn-light:hover{ background:#F4EEE3; color:#15110D; border-color:#F4EEE3; }

  footer{ background:#0E0B08; padding:clamp(40px,6vh,60px) clamp(24px,6vw,110px); display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap; }
  footer span, footer a{ font:500 11px/1.7 'Hanken Grotesk'; letter-spacing:.16em; text-transform:uppercase; color:rgba(244,238,227,.4); text-decoration:none; }
  footer a:hover{ color:#F4EEE3; }

  [data-reveal]{ opacity:0; transform:translateY(26px); transition:opacity 1.2s cubic-bezier(.16,.7,.25,1), transform 1.2s cubic-bezier(.16,.7,.25,1); }
  [data-reveal].is-visible{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    [data-reveal]{ opacity:1; transform:none; transition:none; }
    html{ scroll-behavior:auto; }
  }

  #reels{ padding:0 clamp(24px,6vw,110px) clamp(70px,10vh,130px); max-width:1380px; margin:0 auto; }
  /* every clip is a 16:9 film, so the tiles are too — min() keeps the track from
     outgrowing a narrow phone and forcing a sideways scroll */
  .reels-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));
    gap:clamp(10px,1.4vw,20px); }
  .reel{ position:relative; aspect-ratio:16/9; overflow:hidden; border-radius:var(--radius);
    background:#1A1410; display:block; width:100%; padding:0; border:0; cursor:pointer; }
  .reel img,.reel video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .reel video{ opacity:0; transition:opacity .7s ease; }
  .reel.is-playing video{ opacity:1; }
  .reel::after{ content:''; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(244,238,227,.12); border-radius:var(--radius);
    transition:box-shadow .45s ease; }
  .reel:hover::after,.reel:focus-visible::after{ box-shadow:inset 0 0 0 1px rgba(164,133,90,.85); }
  .reel-cue{ position:absolute; right:11px; bottom:11px; z-index:2; width:30px; height:30px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(15,11,8,.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    color:#F4EEE3; font-size:11px; opacity:0; transition:opacity .45s ease; pointer-events:none; }
  .reel.is-playing .reel-cue,.reel:hover .reel-cue{ opacity:1; }
  .reels-note{ margin-top:clamp(30px,4.5vh,50px); font-size:14px; line-height:1.85; color:var(--inkmute); max-width:52ch; }

  /* tap a tile to watch it full size, with sound */
  #reelBox{ position:fixed; inset:0; z-index:80; background:rgba(10,8,6,.95);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; padding:clamp(14px,4vw,52px); }
  #reelBox.open{ display:flex; }
  #reelBoxVideo{ max-width:min(96vw,1100px); max-height:86vh; width:auto; height:auto;
    border-radius:var(--radius); background:#000; }
  #reelBoxClose{ position:absolute; top:16px; right:16px; min-height:44px; padding:11px 17px;
    border:1px solid rgba(244,238,227,.45); color:#F4EEE3; background:none;
    font:500 11px/1 'Hanken Grotesk'; letter-spacing:.2em; text-transform:uppercase; }
  #reelBoxClose:hover{ background:#F4EEE3; color:#15110D; }

</style>
</head>
<body>

<nav>
  <a href="/" class="logo" aria-label="VASL home"><img src="/favicon/logo.png" alt="VASL"></a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/#about" class="nav-link">About Us</a>
    <a href="/#films" class="nav-link">Films</a>
    <a href="/reels.html" class="nav-link" aria-current="page">Reels</a>
    <a href="/#photography" class="nav-link">Portfolio</a>
    <a href="/travado.html" class="nav-link">The Travado</a>
    <a href="/#experience" class="nav-link">Experience</a>
    <a href="/#contact" class="nav-link">Contact</a>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">Menu</button>
</nav>

<div id="mobileMenu" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="mm-top">
    <a href="/" class="logo" aria-label="VASL home"><img src="/favicon/logo.png" alt="VASL"></a>
    <button class="mm-close" id="mmClose" aria-label="Close menu">Close</button>
  </div>
  <div class="mm-links">
    <a href="/">Home</a>
    <a href="/#about">About Us</a>
    <a href="/#films">Films</a>
    <a href="/reels.html">Reels</a>
    <a href="/#photography">Portfolio</a>
    <a href="/travado.html">The Travado</a>
    <a href="/#experience">Experience</a>
    <a href="/#contact">Contact</a>
  </div>
</div>

<header class="page-head">
  <div class="eyebrow"><span class="line"></span><span class="label">Reels</span></div>
  <h1>The Stories<br><em>We Move</em></h1>

</header>

<section id="reels">
  <div class="reels-grid" id="reelsGrid" data-reveal>
    <button class="reel" data-src="/reels/web/1.mp4" aria-label="Play film 1 with sound">
      <img src="/reels/posters/1.jpg" alt="" loading="lazy"><video muted loop playsinline preload="none"></video>

    <button class="reel" data-src="/reels/web/2.mp4" aria-label="Play film 2 with sound">

    <button class="reel" data-src="/reels/web/3.mp4" aria-label="Play film 3 with sound">

    </button>
    <button class="reel" data-src="/reels/web/4.mp4" aria-label="Play film 4 with sound">

    <button class="reel" data-src="/reels/web/5.mp4" aria-label="Play film 5 with sound">

    <button class="reel" data-src="/reels/web/6.mp4" aria-label="Play film 6 with sound">
      <img src="/reels/posters/6.jpg" alt="" loading="lazy"><video muted loop playsinline preload="none"></video>
      <span class="reel-cue">&#9654;</span>
    </button>
    <button class="reel" data-src="/reels/web/7.mp4" aria-label="Play film 7 with sound">

<div id="reelBox" role="dialog" aria-modal="true" aria-label="Reel">
  <button id="reelBoxClose" aria-label="Close reel">Close</button>
  <video id="reelBoxVideo" playsinline controls loop></video>
</div>

<script>
  var menuBtn = document.getElementById('menuBtn');
  var mobileMenu = document.getElementById('mobileMenu');
  menuBtn.addEventListener('click', function () {
    mobileMenu.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true');
  });
  document.getElementById('mmClose').addEventListener('click', function () {
    mobileMenu.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  });
  (function () {
    var els = document.querySelectorAll('[data-reveal]');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      els.forEach(function (e) { e.classList.add('is-visible'); });
      return;
    }
    els.forEach(function (e) {
      var d = parseFloat(e.getAttribute('data-delay') || '0');
      e.style.transitionDelay = d + 's';
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -5% 0px' });
    els.forEach(function (e) { io.observe(e); });
  })();

  // ---- Reels: play the tiles nearest the middle of the screen ----
  // Ten clips would be ten simultaneous decodes, so only the few closest to the
  // centre ever run; the rest hold on their poster frame.
  (function () {
    var grid = document.getElementById('reelsGrid');
    if (!grid) return;
    var tiles = [].slice.call(grid.querySelectorAll('.reel'));
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var MAX = window.matchMedia('(max-width:700px)').matches ? 2 : 4;
    var visible = [];

    function prime(tile) {
      var v = tile.querySelector('video');
      if (v && !v.src) { v.src = tile.dataset.src; v.load(); }
      return v;
    }

    function update() {
      // nothing in the grid should keep decoding behind the open lightbox
      if (document.getElementById('reelBox').classList.contains('open')) {
        tiles.forEach(function (tile) {
          var v = tile.querySelector('video');
          if (v && !v.paused) v.pause();
          tile.classList.remove('is-playing');
        });
        return;
      }
      var mid = window.innerHeight / 2;
      var ranked = visible.slice().sort(function (a, b) {
        var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        return Math.abs(ra.top + ra.height / 2 - mid) - Math.abs(rb.top + rb.height / 2 - mid);
      }).slice(0, MAX);

      tiles.forEach(function (tile) {
        var v = tile.querySelector('video');
        if (ranked.indexOf(tile) > -1) {
          var play = prime(tile).play();
          if (play && play.catch) play.catch(function () {});
          tile.classList.add('is-playing');
        } else if (v) {
          // clear the class even if it is already paused, or the tile keeps
          // showing a frozen frame instead of falling back to its poster
          if (!v.paused) v.pause();
          tile.classList.remove('is-playing');
        }
      });
    }

    if (!still) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          var at = visible.indexOf(en.target);
          if (en.isIntersecting && at < 0) visible.push(en.target);
          else if (!en.isIntersecting && at > -1) visible.splice(at, 1);
        });
        update();
      }, { threshold: 0.5 });
      tiles.forEach(function (t) { io.observe(t); });

      var queued = false;
      window.addEventListener('scroll', function () {
        if (queued) return;
        queued = true;
        requestAnimationFrame(function () { queued = false; update(); });
      }, { passive: true });
    }

    // ---- Full-size playback, with sound ----
    var box = document.getElementById('reelBox');
    var boxVideo = document.getElementById('reelBoxVideo');

    function closeBox() {
      box.classList.remove('open');
      boxVideo.pause();
      boxVideo.removeAttribute('src');
      boxVideo.load();
      document.body.style.overflow = '';
      update();   // let the grid pick its tiles back up
    }

    tiles.forEach(function (tile) {
      tile.addEventListener('click', function () {
        boxVideo.src = tile.dataset.src;
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
        update();   // park the grid before the full-size clip starts
        var play = boxVideo.play();
        if (play && play.catch) play.catch(function () {});
      });
    });

    document.getElementById('reelBoxClose').addEventListener('click', closeBox);
    box.addEventListener('click', function (e) { if (e.target === box) closeBox(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && box.classList.contains('open')) closeBox();
    });
  })();

</script>
</body>
</html>
